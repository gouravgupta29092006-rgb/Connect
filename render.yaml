services:
  # ─── Backend API Server ─────────────────────────────────────────────────────
  - type: web
    name: connect-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_SSL
        value: true

      # ── Set these in Render Dashboard → connect-backend → Environment ──────
      - key: DATABASE_URL
        sync: false   # postgresql://user:pass@host:5432/dbname?sslmode=require
      - key: JWT_SECRET
        sync: false   # node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: GEMINI_API_KEY
        sync: false   # optional — https://aistudio.google.com/app/apikey (free)

      # ── Firebase Admin SDK (free Spark plan) ───────────────────────────────
      # Paste the ENTIRE service account JSON as one minified line.
      # Get it from: Firebase Console → Project Settings → Service Accounts
      #              → Generate new private key → download JSON
      #              → minify: node -e "console.log(JSON.stringify(require('./key.json')))"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      # Auto-wired from the frontend service URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: connect-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ─── Frontend Next.js Client ────────────────────────────────────────────────
  - type: web
    name: connect-frontend
    env: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      # Auto-wired from the backend service URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: connect-backend
          envVarKey: RENDER_EXTERNAL_URL

      # ── Firebase Client SDK (free Spark plan) ──────────────────────────────
      # Get these from: Firebase Console → Project Settings → General
      #                 → Your Apps → Web App → SDK setup and config
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
