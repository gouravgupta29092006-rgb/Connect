name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Backend API Integration Tests ──────────────────────────────────────────
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: connect_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Execute Database Migrations & Seeds
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://runner:testpassword@localhost:5432/connect_db
        run: npm run migrate

      - name: Run Integration Tests Sequentially
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://runner:testpassword@localhost:5432/connect_db
          JWT_SECRET: testing_ephemeral_secret_key_minimum_32_chars
          PORT: 5000
        run: |
          # Start background server instance
          npm start &
          SERVER_PID=$!
          
          # Await server initialization
          sleep 3
          
          # Run centralized suite assertions
          npm test
          
          # Clean exit background process
          kill $SERVER_PID

  # ─── Frontend Next.js Build Validation ──────────────────────────────────────
  frontend-build:
    name: Frontend Client Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Client Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Optimized Static/Dynamic Compilation
        working-directory: ./frontend
        run: npm run build
